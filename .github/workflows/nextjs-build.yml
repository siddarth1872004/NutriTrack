name: Next.js build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build
        env:
          # Build-time pages that require database access are dynamic and should not connect during build.
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
