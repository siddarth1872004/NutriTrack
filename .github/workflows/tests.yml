name: NutriTrack checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile server
        run: python -m py_compile server.py
      - name: Test role and dietitian workflows
        run: python -m unittest discover -s tests -v
