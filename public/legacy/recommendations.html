<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NutriTrack · Dietitian notes</title><style>:root{font-family:system-ui,sans-serif;color:#24231f;background:#f4f1e9}*{box-sizing:border-box}body{max-width:850px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid #24231f;padding-bottom:18px}.brand{font-size:1.8rem;font-weight:900}.brand span{color:#ff4d1a}h1{font-size:1.45rem;margin:8px 0}p{color:#6b685f;line-height:1.5}a,button{display:inline-block;border:1px solid #24231f;border-radius:5px;padding:9px 13px;background:#24231f;color:white;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}.panel{background:#fffdf8;border:1px solid #d8d2c6;border-radius:8px;padding:18px;margin-top:16px}.note{padding:14px 0;border-bottom:1px solid #e6e1d8;white-space:pre-wrap;overflow-wrap:anywhere}.note:last-child{border-bottom:0}.date{font-size:.78rem;color:#777;margin-bottom:6px}.empty{padding:18px;border:1px dashed #d8d2c6;color:#777}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><header class="top"><div><div class="brand">NutriTrack<span>.</span></div><h1>Dietitian recommendations</h1><p>Feedback shared with you by your assigned dietitian.</p></div><div class="actions"><a href="/">Back to tracker</a><a href="/auth/logout">Sign out</a></div></header><main class="panel"><div id="notes" aria-live="polite">Loading recommendations…</div></main><script>async function load(){const r=await fetch('/api/my-recommendations',{credentials:'same-origin',cache:'no-store'});if(r.status===401){location.href='/login';return}const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load recommendations');const box=document.getElementById('notes');box.replaceChildren();if(!d.recommendations.length){const e=document.createElement('div');e.className='empty';e.textContent='No recommendations yet. An administrator can assign a dietitian to your account.';box.append(e);return}for(const n of d.recommendations){const item=document.createElement('article');item.className='note';const date=document.createElement('div');date.className='date';date.textContent=n.created_at+' · '+n.dietitian;const message=document.createElement('div');message.textContent=n.message;item.append(date,message);box.append(item)}}load().catch(e=>{document.getElementById('notes').textContent=e.message})</script></body></html>
